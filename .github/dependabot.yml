# Revisa cada semana si alguna librería tiene una versión nueva o un problema de seguridad
# y abre una propuesta de actualización (pull request) en GitHub para aprobar.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
