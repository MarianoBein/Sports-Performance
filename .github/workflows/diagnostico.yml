# Diagnóstico a pedido: comprueba que la app publicada tenga todo configurado
# (sin mostrar ninguna clave secreta). Los resultados quedan como avisos del job.
name: Diagnóstico de la app
on:
  workflow_dispatch:
env:
  APP_URL: https://sports-performance-five.vercel.app
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar
        run: |
          web=$(curl -sS -o /dev/null -w "%{http_code}" "$APP_URL/")
          echo "::notice title=Web::código $web"
          salud=$(curl -sS "$APP_URL/api/salud" -w " %{http_code}")
          echo "::notice title=Base de datos::$salud"
          av=$(curl -sS "$APP_URL/api/avisos")
          if echo "$av" | grep -q '"publica":"B'; then echo "::notice title=VAPID_PUBLIC_KEY::OK"; else echo "::notice title=VAPID_PUBLIC_KEY::FALTA ($av)"; fi
          cron=$(curl -sS -X POST -H 'x-cron-secret: prueba-incorrecta' "$APP_URL/api/avisos" -w " %{http_code}")
          echo "::notice title=Avisos con clave incorrecta::$cron (esperado 401)"
          rc=$(curl -sS -X POST -H 'Content-Type: application/json' -H 'Authorization: Bearer x' -d '{"perfil_id":"00000000-0000-0000-0000-000000000000"}' "$APP_URL/api/restablecer-clave" -w " %{http_code}")
          echo "::notice title=Restablecer contraseña::$rc"
